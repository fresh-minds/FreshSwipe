name: CI (Unified Container)

on:
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pytest httpx

      - name: Run Tests
        working-directory: ./app/backend
        run: pytest

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      - name: Type Check & Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
          NEXTAUTH_URL: "http://localhost:8081"
          NEXTAUTH_SECRET: "mock-secret-for-build"

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
          NEXTAUTH_URL: "http://localhost:8081"
          NEXTAUTH_SECRET: "mock-secret-for-e2e"
          AZURE_ENTRA_AD_CLIENT_ID: "mock-client-id"
          AZURE_ENTRA_AD_CLIENT_SECRET: "mock-client-secret"
          AZURE_ENTRA_TENANT_ID: "common"

      - name: Start Frontend Server
        run: |
          PORT=8081 \
          NEXT_PUBLIC_API_URL="http://localhost:8081" \
          NEXTAUTH_URL="http://localhost:8081" \
          NEXTAUTH_SECRET="mock-secret-for-e2e" \
          AZURE_ENTRA_AD_CLIENT_ID="mock-client-id" \
          AZURE_ENTRA_AD_CLIENT_SECRET="mock-client-secret" \
          AZURE_ENTRA_TENANT_ID="common" \
          npm run start > /tmp/next.log 2>&1 &
          npx wait-on http://localhost:8081/login

      - name: Run E2E Tests
        run: BASE_URL="http://localhost:8081" npm run test:e2e

  unified-container-build:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, frontend-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Build Unified Container
        run: docker build -f container/Dockerfile .
