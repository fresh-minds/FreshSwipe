name: Main Pipeline (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==================================================================================
  # 1. TEST JOBS (From original CI)
  # ==================================================================================
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt
          pip install pytest httpx

      - name: Run Tests
        working-directory: ./app/backend
        run: pytest

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
          NEXTAUTH_URL: "http://localhost:8081"
          NEXTAUTH_SECRET: "mock-secret-for-build"

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    defaults:
      run:
        working-directory: ./app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8081"
          NEXTAUTH_URL: "http://localhost:8081"
          NEXTAUTH_SECRET: "mock-secret-for-e2e"
          AZURE_ENTRA_AD_CLIENT_ID: "mock-client-id"
          AZURE_ENTRA_AD_CLIENT_SECRET: "mock-client-secret"
          AZURE_ENTRA_TENANT_ID: "common"

      - name: Start Frontend Server
        run: |
          PORT=8081 \
          NEXT_PUBLIC_API_URL="http://localhost:8081" \
          NEXTAUTH_URL="http://localhost:8081" \
          NEXTAUTH_SECRET="mock-secret-for-e2e" \
          AZURE_ENTRA_AD_CLIENT_ID="mock-client-id" \
          AZURE_ENTRA_AD_CLIENT_SECRET="mock-client-secret" \
          AZURE_ENTRA_TENANT_ID="common" \
          npm run start > /tmp/next.log 2>&1 &
          npx wait-on http://localhost:8081/login

      - name: Run E2E Tests
        run: BASE_URL="http://localhost:8081" npm run test:e2e

  # ==================================================================================
  # 2. BUILD & PUSH (Reuses build logic, Pushes only on Main)
  # ==================================================================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, frontend-e2e]
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Azure to get ACR credentials (only needed if we push)
      - name: Azure Login
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        if: github.ref == 'refs/heads/main'
        run: |
          az acr login --name acrfreshswipeuni2

      # Build and Push (if on main)
      # If not on main, we just build to verify the Dockerfile is valid
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: container/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ github.ref == 'refs/heads/main' && 'freshswipeuni2.azurecr.io/freshswipe-unified:latest' || '' }}
          # Note: Replace 'freshswipeuni2.azurecr.io' with actual ACR login server if different
          # We derived 'freshswipeuni2' from the deploy script logic (freshswipe-uni + 2)

  # ==================================================================================
  # 3. DEPLOY (Only on Main)
  # ==================================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart Web App
        run: |
          echo "Restarting Web App to pull the new image..."
          az webapp restart --resource-group dev-freshswipe-uni-rg2 --name app-freshswipe-uni2
